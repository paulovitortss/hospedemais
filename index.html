<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B1713">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Teresina Hotel — guia do hóspede: gastronomia, mobilidade, bem-estar, vida noturna e serviços do hotel.">
  <link rel="icon" type="image/png" href="assets/favicon.png?v=7">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=7">
  <title>Teresina Hotel · Guia do Hóspede</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css?v=7">
  <link rel="stylesheet" href="css/components.css?v=7">
  <link rel="stylesheet" href="css/pages.css?v=7">
</head>
<body>
  <!-- Tela de boas-vindas (exibida uma vez por sessão) -->
  <div id="splash" class="splash" hidden>
    <div class="splash__photo" aria-hidden="true"></div>
    <div class="splash__inner">
      <div class="splash__logo" data-logo="draw"></div>
      <p class="eyebrow eyebrow--center">Bem-vindo à sua estadia</p>
      <h1 class="splash__title">Teresina Hotel</h1>
      <p class="splash__text">Tudo o que você precisa durante a sua estadia, na palma da mão.</p>
      <button class="btn btn--gold" id="splash-start" type="button">
        Começar
        <span class="btn__arrow" aria-hidden="true">→</span>
      </button>
    </div>
  </div>

  <div class="app">
    <header class="topbar" id="topbar"></header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="dock" aria-label="Navegação principal">
    <a class="dock__item" href="#/" data-dock="home">
      <span class="dock__icon" data-icon="home"></span><span>Início</span>
    </a>
    <a class="dock__item" href="#/servicos" data-dock="servicos">
      <span class="dock__icon" data-icon="bell"></span><span>Serviços</span>
    </a>
    <button class="dock__item" type="button" data-action="wifi">
      <span class="dock__icon" data-icon="wifi"></span><span>Wi-Fi</span>
    </button>
    <button class="dock__item" type="button" data-action="recepcao">
      <span class="dock__icon" data-icon="concierge"></span><span>Recepção</span>
    </button>
  </nav>

  <!-- Bottom sheet -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet__grip" aria-hidden="true"></div>
      <button class="sheet__close" type="button" data-close aria-label="Fechar">✕</button>
      <div class="sheet__body" id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js?v=7"></script>
  <script src="js/data.js?v=7"></script>
  <script src="js/ui.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
